[package]
name = "search_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.10"
html-escape = "0.2"
walkdir = "2"
anyhow = "1"
regex = "1"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
criterion = "0.5"
